routes:
  - uri: /*
    host: auth.baucord.com
    upstream:
      type: roundrobin
      nodes:
        "baucord:5001": 1
# Media UDP (5000) no longer goes through APISIX — it is published directly
# from the baucord service in docker-compose.yml. The old stream_routes (ids
# 1 and 2) are removed from etcd by scripts/setup.sh; certer only upserts.
global_rules:
  - id: "1"
    plugins:
      prometheus:
        disable: true
#END
