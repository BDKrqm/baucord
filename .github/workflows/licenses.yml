# Generates the third-party license files for the commit being built.
# Called by the release and website workflows, which build with this artifact.
name: licenses

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out (empty = the triggering ref)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        run: |
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$CHANNEL" --profile minimal

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Generate license files
        run: python3 scripts/licenses.py

      - name: Upload license files
        uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: |
            crates/frontend/licenses.json
            web/licenses.html
          if-no-files-found: error
          retention-days: 7
