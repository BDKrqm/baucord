name: Build and Release
on:
  release:
    types: [published]
  # Cache seeding: release runs execute on a tag ref, and tag runs can only
  # restore GitHub Actions caches that were created on the repository's
  # DEFAULT branch. Without a trigger on the default branch, every release
  # starts cold (this run: 0% sccache hits on all 4 platforms, and
  # rust-cache logged "No cache found"). Point this at your default branch.
  push:
    branches:
      - "chunk" # ← must be the repo's default branch for releases to see the caches
env:
  # FFmpeg comes from vcpkg PINNED to the last ffmpeg 7.1.2 port. vcpkg
  # HEAD ships FFmpeg 9.x, which ffmpeg-next 8.1 cannot build against
  # (FFmpeg 8 deleted the deprecated AVCodec field API the crate's
  # fallback path uses, and its version detection is unreliable under
  # vcpkg). Do NOT bump this without re-testing the full Windows build
  # AND a real stream — encoder options are validated at runtime, not
  # compile time. macOS builds a pinned STATIC FFmpeg 7.1.1 from source
  # (see the macOS steps) for the same reason — and so released binaries
  # don't require users to have brewed FFmpeg dylibs at all.
  VCPKG_COMMIT: 34823ada10080ddca99b60e85f80f55e18a44eea # ffmpeg 7.1.2

jobs:
  build:
    strategy:
      matrix:
        include:
          # ubuntu-24.04, pinned explicitly (not -latest, which silently
          # bumps floors on every runner-image upgrade). 24.04 is the
          # OLDEST runner that can build this tree: libspa/pipewire-rs
          # generates its bindings from the system PipeWire headers, and
          # 22.04's PipeWire 0.3.48 predates spa_meta_first /
          # spa_meta_region_is_valid — the build fails there. Cost: the
          # release binary inherits glibc 2.39 as its floor (won't run
          # on Ubuntu 22.04 / Debian 12 era systems). If old-distro
          # support ever matters, the fix is a container build with
          # backported PipeWire headers, not an older runner.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            # x86-64-v2: SSE4.2, SSSE3, POPCNT — supported since Nehalem (2008).
            # Safe baseline for any x86_64 machine from the last ~15 years.
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-intel
            rustflags: "-C target-cpu=x86-64-v2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Release runs are on tag refs; caches saved there can never be
          # restored by other refs, so saving is pure wasted time/quota.
          # Only the default-branch (push) runs should save.
          save-if: ${{ github.event_name != 'release' }}

      # ── System dependencies ─────────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake nasm libclang-dev \
            libopus-dev libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libxft-dev libfontconfig1-dev \
            libpango1.0-dev libcairo2-dev \
            libgbm-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev

      - name: Cache static FFmpeg (Linux)
        if: runner.os == 'Linux'
        id: ffmpeg-static-linux-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-7.1.1-x264-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build static FFmpeg 7.1.1 + x264 (Linux)
        if: runner.os == 'Linux' && steps.ffmpeg-static-linux-cache.outputs.cache-hit != 'true'
        # Same pin + rationale as macOS: released binaries must not
        # depend on distro FFmpeg (sonames differ per distro/release —
        # libavcodec.so.60 vs .61 vs Fedora's patent-stripped builds —
        # so a dynamically linked binary launches only on distros
        # matching the runner's FFmpeg, and ubuntu's moves every LTS).
        run: |
          set -euo pipefail
          PREFIX="$HOME/ffmpeg-static"
          mkdir -p "$PREFIX" /tmp/ffbuild
          cd /tmp/ffbuild
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --prefix="$PREFIX" --enable-static --enable-pic --disable-cli --disable-opencl
          make -j"$(nproc)"
          make install
          cd /tmp/ffbuild
          curl -LO https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
          tar xf ffmpeg-7.1.1.tar.xz
          cd ffmpeg-7.1.1
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" ./configure \
            --prefix="$PREFIX" \
            --disable-shared --enable-static --enable-pic \
            --disable-programs --disable-doc \
            --enable-gpl --enable-libx264
          make -j"$(nproc)"
          make install

      - name: Use static FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-static/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALL_STATIC=1" >> "$GITHUB_ENV"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # No brew ffmpeg: released binaries must not depend on dylibs the
        # user has to install (a Mac without `brew install ffmpeg@7` gets
        # a dyld launch crash, and plain `ffmpeg` is v8/9 — the same
        # ffmpeg-next breakage the vcpkg pin exists for). FFmpeg is
        # built statically below, pinned, like the Windows vcpkg build.
        run: |
          brew install opus pkg-config nasm

      - name: Cache static FFmpeg (macOS)
        if: runner.os == 'macOS'
        id: ffmpeg-static-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-7.1.1-x264-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build static FFmpeg 7.1.1 + x264 (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-static-cache.outputs.cache-hit != 'true'
        # 7.1.1 matches the Windows pin's FFmpeg version (7.1.x): the
        # newest line ffmpeg-next 8.1 reliably builds against. x264 is
        # the software encoder the macOS sharer path uses. videotoolbox
        # is compiled in (free) for a future hardware-decode path.
        run: |
          set -euo pipefail
          PREFIX="$HOME/ffmpeg-static"
          mkdir -p "$PREFIX" /tmp/ffbuild
          cd /tmp/ffbuild
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --prefix="$PREFIX" --enable-static --disable-cli --disable-opencl
          make -j"$(sysctl -n hw.ncpu)"
          make install
          cd /tmp/ffbuild
          curl -LO https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
          tar xf ffmpeg-7.1.1.tar.xz
          cd ffmpeg-7.1.1
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" ./configure \
            --prefix="$PREFIX" \
            --disable-shared --enable-static \
            --disable-programs --disable-doc \
            --enable-gpl --enable-libx264 --enable-videotoolbox
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Use static FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-static/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALL_STATIC=1" >> "$GITHUB_ENV"

      # No prebuilt static-md binary exists anywhere with this exact codec
      # feature set (x264, gpl, nvcodec, amf) plus the headers/.lib
      # files needed to link into a Rust binary, so we build it with vcpkg
      # like a local dev machine would. qsv is deliberately absent: at the
      # pinned port it pulls the legacy mfx dispatch (the vpl switch came
      # later) and is untested with our static-md link; the runtime
      # encoder probe handles its absence. Re-add only with a full retest. The `installed` tree is cached by
      # feature set below, so this only compiles from scratch when that
      # set changes (or the cache is evicted) — otherwise it's a fast
      # cache restore + vcpkg no-op.
      - name: Clone and bootstrap vcpkg (Windows, pinned)
        if: runner.os == 'Windows'
        # Shallow-fetch exactly the pinned commit instead of cloning HEAD
        # (HEAD's ffmpeg port is 9.x — see VCPKG_COMMIT above).
        run: |
          git init C:\vcpkg
          git -C C:\vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C C:\vcpkg fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C C:\vcpkg checkout FETCH_HEAD
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: pwsh

      - name: Cache vcpkg installed packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          # The pinned commit is part of the key, so bumping VCPKG_COMMIT
          # auto-invalidates (and any tree cached by earlier UNPINNED runs
          # can never be restored). Bump the trailing version number only
          # if the feature list or triplet changes.
          key: vcpkg-ffmpeg-${{ env.VCPKG_COMMIT }}-x64-windows-static-md-x264-gpl-nvcodec-amf-v2

      - name: Install FFmpeg via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\vcpkg.exe install ffmpeg[x264,gpl,nvcodec,amf]:x64-windows-static-md --recurse
          echo "FFMPEG_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV
        shell: pwsh

      # ── Build ───────────────────────────────────────────────────────

      # sccache v0.17.0 (PR #2782) can PARSE the @argfile that cargo passes
      # when a rustc command line exceeds the Windows 32,767-char limit, but
      # it still RE-SPAWNS rustc with all arguments flattened back onto the
      # command line (dep-info, --print file-names, and the compile itself in
      # src/compiler/rust.rs). ffmpeg-sys-next's build script emits ~680
      # --cfg flags (~40K chars), so that spawn dies with os error 206.
      # The shim below routes @argfile invocations straight to rustc (which
      # supports @argfile natively) and everything else through sccache, so
      # only ffmpeg-sys-next skips the cache. Remove the shim once sccache
      # writes argfiles when spawning rustc on Windows.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"

      - name: Build rustc shim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: rustc -O ci/rustc-shim.rs -o C:\rustc-shim.exe

      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: ${{ runner.os == 'Windows' && 'C:\rustc-shim.exe' || 'sccache' }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --profile deploy --target ${{ matrix.target }} --features tray

      - name: Verify FFmpeg statically linked (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/deploy/baucord"
          echo "── dynamic dependencies ──"
          ldd "$BIN"
          if ldd "$BIN" | grep -E "libav|libsw|libpostproc|libx264"; then
            echo "::error::baucord still links FFmpeg/x264 shared objects — the static build was not picked up"
            exit 1
          fi

      - name: Verify FFmpeg statically linked (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="target/${{ matrix.target }}/deploy/baucord"
          echo "── dynamic dependencies ──"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -E "libav|libsw|libpostproc"; then
            echo "::error::baucord still links FFmpeg dylibs — the static build was not picked up"
            exit 1
          fi

      - name: Show sccache stats
        shell: bash
        run: sccache --show-stats

      # ── Package ─────────────────────────────────────────────────────
      # Packaging/upload only matter for release runs; push runs on the
      # default branch exist purely to build and warm the caches.

      - name: Get version
        id: version
        shell: bash
        run: grep '^version' crates/desktop/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | xargs -I{} echo "version={}" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: runner.os != 'Windows' && github.event_name == 'release'
        # The desktop crate pins `[[bin]] name = "baucord"` (the updater
        # and release zips expect that exact name), so cargo's output is
        # `baucord`, not `desktop`.
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/deploy/baucord staging/baucord
          cp target/${{ matrix.target }}/deploy/server staging/dedicated-server
          cd staging
          zip -r ../baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip baucord dedicated-server

      - name: Package (Windows)
        if: runner.os == 'Windows' && github.event_name == 'release'
        # Same as Unix: the binary is already named baucord.exe.
        run: |
          mkdir staging
          copy target\${{ matrix.target }}\deploy\baucord.exe staging\baucord.exe
          copy target\${{ matrix.target }}\deploy\server.exe staging\dedicated-server.exe
          cd staging
          Compress-Archive -Path baucord.exe,dedicated-server.exe -DestinationPath ..\baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip

      - name: Upload artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          path: baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Guard — release tag must match crate version
        # The R2 `version` file and asset names come from Cargo.toml; a
        # mismatched tag ships a release whose name disagrees with what
        # the in-app updater announces. Fail here, before anything is
        # published.
        run: |
          VERSION=$(grep '^version' crates/desktop/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG="${{ github.event.release.tag_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG != crates/desktop version v$VERSION — retag or bump the crate."
            exit 1
          fi
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*.zip
      - name: Prepare release files for R2
        run: |
          VERSION=$(grep '^version' crates/desktop/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          mkdir -p r2-upload
          cp artifacts/*.zip r2-upload/
          echo "$VERSION" > r2-upload/version
      - name: Upload to R2
        uses: jakejarvis/s3-sync-action@v0.5.1
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: r2-upload
