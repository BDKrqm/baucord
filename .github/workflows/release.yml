name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake libopus-dev libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libxft-dev libfontconfig1-dev \
            libpango1.0-dev libcairo2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging/baucord
          cp target/${{ matrix.target }}/release/client staging/baucord/baucord
          cp target/${{ matrix.target }}/release/server staging/baucord/dedicated-server
          cd staging
          zip -r ../baucord-${{ matrix.suffix }}.zip baucord/
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staging\baucord
          copy target\${{ matrix.target }}\release\client.exe staging\baucord\baucord.exe
          copy target\${{ matrix.target }}\release\server.exe staging\baucord\dedicated-server.exe
          cd staging
          Compress-Archive -Path baucord -DestinationPath ..\baucord-${{ matrix.suffix }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baucord-${{ matrix.suffix }}
          path: baucord-${{ matrix.suffix }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*.zip

      - name: Upload to R2/S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: artifacts