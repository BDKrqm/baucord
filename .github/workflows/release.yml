name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt-get install -y \
          pkg-config cmake libopus-dev libasound2-dev \
          libx11-dev libxext-dev libxinerama-dev libxcursor-dev \
          libxrender-dev libxfixes-dev libxft-dev libfontconfig1-dev \
          libpango1.0-dev libcairo2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install opus:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Build client
        run: cargo build --release --bin client --target ${{ matrix.target }}

      - name: Build server
        run: cargo build --release --bin server --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/client dist/client-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/server dist/server-${{ matrix.suffix }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\client.exe dist\client-${{ matrix.suffix }}.exe
          copy target\${{ matrix.target }}\release\server.exe dist\server-${{ matrix.suffix }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*
