name: CI
on:
  push:
    branches: [main]

jobs:
  ios-seam:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-seam
      - name: Core compiles for iOS
        run: cargo check -p client --target aarch64-apple-ios
      - name: Audio compiles for iOS
        run: cargo check -p audio --target aarch64-apple-ios
