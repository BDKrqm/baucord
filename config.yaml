server:
  name: "Baucord"
  host: "0.0.0.0"
  port: 5000
  greeting_message: "Welcome to the official baucord server! Type /help for available commands."

network:
  max_clients: 64
  protocol_id: 27

channels:
  reliable_channel_id: 2
  voice_channel_id: 3
  voice_buffer_size_mb: 5

logging:
  level: "info" # Options: trace, debug, info, warn, error
  stats_interval_secs: 30

authentication:
  enabled: false

