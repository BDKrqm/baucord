[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
chrono = "0.4.41"
fltk = { version = "1.5", features = ["fltk-bundled"] }
renet = "1.1.0"
renet_netcode = "1.1.0"
log = "0.4"
env_logger = "0.11"
opus = { git = "https://github.com/SpaceManiac/opus-rs" }
cpal = "0.15"
voice-chat-core = { path = "../core" }
voice_activity_detector = { version = "0.2", features = [
  "load-dynamic",
], optional = true }
earshot = { version = "0.1", optional = true }
serde_json = "1.0"
dirs = "5.0"
rubato = "0.16.2"
crossbeam = "0.8.4"
rtrb = "0.3.2"
crossbeam-channel = "0.5.15"
dasp_sample = "0.11.0"
rand = "0.9.2"


[features]
default = ["earshot"]
earshot = ["dep:earshot"]
silero = ["dep:voice_activity_detector"]
